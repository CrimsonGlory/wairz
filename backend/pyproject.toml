[project]
name = "wairz-backend"
version = "0.1.0"
description = "Wairz - AI-Assisted Firmware Reverse Engineering & Security Assessment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "pyelftools>=0.31",
    "fdt>=0.3.3",
    "aiofiles>=24.0.0",
    "weasyprint>=62.0",
    "pypdf>=4.0",
    "packageurl-python>=0.15.0",
    "nvdlib>=0.7.6",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.2.0",
    "cryptography>=43.0.0",
    "yara-python>=4.5.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "lief>=0.15.0",
    "pefile>=2024.8",
    "capstone>=5.0.0",
    "aiosqlite>=0.20.0",
    "rapidfuzz>=3.0.0",
    "scapy>=2.6",
    "bandit>=1.7",
    "clamd>=1.0.2",
    "androguard>=4.1.2",
    "mobsfscan>=0.3.0",
    "semgrep>=1.80.0",
    "setuptools>=70.0",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # ── Phase β: Authenticode + RICH header + DBX revocation ────
    # signify — happy-path PE Authenticode validation (Persona-B/E #5).
    # asn1crypto — ASN.1/PKCS#7 primitives for malformed/legacy chains
    #   and the dual-sig (SHA-1+SHA-256) path that signify's "best mode"
    #   doesn't enumerate (Persona-E sec.2 #3).
    # uefi-firmware — DBX EFI_SIGNATURE_LIST parsing (Persona-E #10).
    "signify>=0.7",
    "asn1crypto>=1.5",
    "uefi-firmware>=1.11",
    # ── Phase γ: registry hive walking ─────────────────────────
    # regipy — pure-Python read-only Windows registry hive walker.
    # Persona-E #13 registry persistence + driver matrix view. We
    # picked regipy over pyhivex (libhivex Python binding): regipy
    # is more mature for read-only walks, has fewer C-extension
    # build dependencies, and matches our async-then-executor
    # discipline (Rule #5) without ABI surprises. Rule #36 no-execute
    # discipline applies — regipy parses the hive AS DATA; nothing in
    # wairz invokes regedit, .reg apply, or any scriptable
    # registry-modification action.
    "regipy>=4.0,<5",
    # ── Phase δ: .NET single-file bundle decompile + R2R-stomping ──
    # dnfile — read-only PE-table walker for .NET assemblies. Phase δ.4
    # worker uses dnfile to detect single-file bundles + walk the embedded
    # AppHostBundle / DEPS / runtimeconfig metadata; Phase δ.6 R2R-stomping
    # detector reads ReadyToRun PE table flags via dnfile.
    # dncil — IL disassembler for .NET method bodies. Used by capa-on-IL
    # in Phase δ.6 R2R-stomping detector to compare prologue IL signatures
    # against ReadyToRun-promoted native code.
    # flare-capa — capability detection over IL (Phase δ.6). Pulls in
    # dnfile + dncil + yara-python as transitive deps; we declare the two
    # we use directly (dnfile + dncil) so a future capa version bump
    # doesn't accidentally unbind them. yara-python>=4.5.0 already pinned
    # above (used by detect_capabilities binary tool).
    # Rule #36 no-execute discipline applies to ALL three: dnfile parses
    # PE tables AS DATA; dncil decodes IL bytes AS DATA; flare-capa runs
    # rule-based capability matching over the IL/data — nothing in wairz
    # invokes the .NET assembly entry point.
    "dnfile>=0.18",
    "dncil>=1.0",
    "flare-capa>=9.4",
]

[project.scripts]
wairz-mcp = "app.mcp_server:main"
wairz-scan = "app.cli.scan:main"
wairz-compare-apk = "app.cli.compare_apk:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "ASYNC",# flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert usage (fine in tests)
    "S603",  # subprocess without shell=True check (too noisy for this codebase)
    "S607",  # partial executable path (too noisy for CLI tool invocations)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"alembic/**" = ["E", "W"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101", "B603", "B607"]
