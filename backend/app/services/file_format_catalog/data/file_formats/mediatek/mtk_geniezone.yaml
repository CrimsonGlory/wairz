# yaml-language-server: $schema=../../.schema.json
schema_version: 1
format_id: mtk_geniezone
manifest_source: core
precedence: 100
category: tee
vendor: mediatek
confidence: high
notes: |
  MediaTek GenieZone (GZ) hypervisor partition. Dispatched from
  mtk_lk via the partition-name 'gz'. Standalone filename catches
  partitions extracted from larger images.
detection:
  combine: all_required
  signals:
    - kind: filename
      stems_lower:
        - gz.img
        - gz.bin
      description: "GenieZone partition filename stem"
output:
  classifier_format: mtk_geniezone
  classifier_category: tee
  classifier_vendor: mediatek
  confidence: high
