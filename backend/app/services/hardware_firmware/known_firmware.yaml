    severity: critical
    cvss_score: 9.8
    notes: |
      Check Point 2020.  Command injection in MediaTek TEE driver.  Root
      persistence.  Actively exploited ITW for ~2 years.

  - name: Hexagon Achilles (CVE-2020-11201-11209)
    vendor: qualcomm
    category_regex: "^(dsp|audio)$"
    chipset_regex: "(?i)^(sm|sdm|qcm|qm|sa)(4[0-9]{3}|6[0-9]{3}|7[0-9]{3}|8[0-9]{3}).*"
    cves:
      - CVE-2020-11201
      - CVE-2020-11202
      - CVE-2020-11203
      - CVE-2020-11204
      - CVE-2020-11205
      - CVE-2020-11206
      - CVE-2020-11207
      - CVE-2020-11208
      - CVE-2020-11209
    severity: high
    cvss_score: 8.4
    notes: |
      Check Point "Achilles" 2020.  400+ vulns in Hexagon SDK/skeletons
      (aDSP, cDSP, mDSP).  Unprivileged app loading shaders via FastRPC.
      Soft chipset match — fires on Snapdragon-family audio/DSP blobs
      regardless of build banner; the original "pre-aug-2020" version_regex
      never matched because Qualcomm DSP firmware doesn't surface build
      dates in extractable banner strings. category_regex covers both
      audio (aDSP) and dsp (cDSP/mDSP) — the bug class spans all three.

