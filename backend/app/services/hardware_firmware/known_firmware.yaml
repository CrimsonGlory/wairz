# Curated hardware firmware CVE database.
# Each entry is matched against HardwareFirmwareBlob rows.
#
# Matching: a blob MATCHES an entry when:
#   - blob.vendor == entry.vendor (case-insensitive) AND
#   - blob.category == entry.category (case-insensitive) AND
#   - (entry.version_regex is absent) OR
#     (blob.version matches entry.version_regex) OR
#     (any string in blob.metadata values matches entry.version_regex)
#   - optional entry.chipset_regex, blob.chipset_target matches
#
# Written 2026-04-17 for Wairz hw-firmware Phase 4.

families:
  - name: BroadPwn
    vendor: broadcom
    category: wifi
    chipset_regex: "^bcm43(25|30|35|40|50|55|58|59)[0-9a-z]*$"
    version_regex: "^7\\.(3[0-9]|4[0-9]|5[0-9])\\..*$"
    cves:
      - CVE-2017-9417
    severity: critical
    cvss_score: 9.8
    notes: |
      Nitay Artenstein, BlackHat USA 2017. Stack overflow in BCM43xx Wi-Fi
      firmware parsing WME IE. RCE on chip, pivot to host via ring buffer.

  - name: Snapdragon modem RCE (CVE-2020-11292)
    vendor: qualcomm
    category: modem
    chipset_regex: "(?i)^(sm|sdm|qcm|qm|sa)(4[0-9]{3}|6[0-9]{3}|7[0-9]{3}|8[0-9]{3}|x[0-9]{2,3}).*"
    cves:
      - CVE-2020-11292
    severity: critical
    cvss_score: 9.8
    notes: |
      Check Point Research 2020.  Heap overflow in QMI voice service,
      exploitable via VoLTE signalling.  ~40% of handsets impacted.
      Soft chipset match (Snapdragon family); downgrade to medium
      confidence when blob.chipset_target is unpopulated — pre-2020-08
      modem firmware is the vulnerable cohort but the exact build date
      is rarely surfaced in modem.b0X blobs.

  - name: Exynos Shannon RCE cluster (March 2023)
    vendor: samsung
    category: modem
    version_regex: "(?i)s5([0-9]{3})[a-z]?.*"
    cves:
      - CVE-2023-24033
      - CVE-2023-26496
      - CVE-2023-26072
      - CVE-2023-26073
      - CVE-2023-26074
    severity: critical
    cvss_score: 9.8
    notes: |
      Project Zero March 2023. OTA RCE with only phone number (VoLTE IMS).
      Pixel 6/7, Galaxy S22, Vivo, wearables.

  - name: Samsung TEEGRIS "Powerful Clipboard"
    vendor: samsung
    category: tee
    version_regex: "(?i)teegris.*(pre\\-nov\\-2022|20(1[5-9]|2[0-1])|2022\\-(0[1-9]|10)).*"
    cves:
      - CVE-2021-25337
      - CVE-2021-25369
      - CVE-2021-25370
    severity: high
    cvss_score: 8.8
    notes: |
      Project Zero Maddie Stone Nov 2022.  Chained vulns from unprivileged
      app to arbitrary R/W inside TEEGRIS.  Widespread Samsung devices.

  - name: Mali GPU CSF exploit
    vendor: arm
    category: gpu
    chipset_regex: "(?i)^mali(\\-(g[57][0-9]|g1[0-9]))?.*"
    version_regex: "(?i)(r[0-3][0-9]p[0-9]).*"
    cves:
      - CVE-2023-4211
      - CVE-2023-48409
      - CVE-2022-38181
      - CVE-2022-22706
    severity: high
    cvss_score: 7.8
    notes: |
      Project Zero Jann Horn 2022-2023.  Mali CSF firmware scheduling +
      kernel driver bugs.  In-the-wild Android sandbox escapes (Samsung,
      Pixel).

  - name: MediaTek-SU
    vendor: mediatek
    category: tee
    version_regex: "(?i).*(geniezone|teei|mtee).*(pre\\-mar\\-2020|2019|2020\\-0[1-2]).*"
    cves:
      - CVE-2020-0069
    severity: critical
    cvss_score: 9.8
    notes: |
      Check Point 2020.  Command injection in MediaTek TEE driver.  Root
      persistence.  Actively exploited ITW for ~2 years.

  - name: Hexagon Achilles (CVE-2020-11201-11209)
    vendor: qualcomm
    category_regex: "^(dsp|audio)$"
    chipset_regex: "(?i)^(sm|sdm|qcm|qm|sa)(4[0-9]{3}|6[0-9]{3}|7[0-9]{3}|8[0-9]{3}).*"
    cves:
      - CVE-2020-11201
      - CVE-2020-11202
      - CVE-2020-11203
      - CVE-2020-11204
      - CVE-2020-11205
      - CVE-2020-11206
      - CVE-2020-11207
      - CVE-2020-11208
      - CVE-2020-11209
    severity: high
    cvss_score: 8.4
    notes: |
      Check Point "Achilles" 2020.  400+ vulns in Hexagon SDK/skeletons
      (aDSP, cDSP, mDSP).  Unprivileged app loading shaders via FastRPC.
      Soft chipset match — fires on Snapdragon-family audio/DSP blobs
      regardless of build banner; the original "pre-aug-2020" version_regex
      never matched because Qualcomm DSP firmware doesn't surface build
      dates in extractable banner strings. category_regex covers both
      audio (aDSP) and dsp (cDSP/mDSP) — the bug class spans all three.

  - name: MediaTek-reaver
    vendor: mediatek
    category: modem
    chipset_regex: "(?i)^mt6[78][0-9]{2}.*"
    cves:
      - CVE-2021-30351
      - CVE-2020-3714
    severity: high
    cvss_score: 8.1
    notes: |
      Check Point 2021.  RRC/NAS buffer overflows in MediaTek modem stack.

  - name: Kr00k
    vendor: cypress
    category: wifi
    version_regex: "(?i)(bcm43430|bcm4345).*"
    cves:
      - CVE-2019-15126
    severity: medium
    cvss_score: 6.5
    notes: |
      ESET 2020.  All-zero encryption key after disassociation on Cypress/
      Broadcom Wi-Fi.  Widespread impact.

  - name: BleedingTooth (Linux kernel BlueZ)
    advisory_id: ADVISORY-BLEEDTOOTH
    vendor: unknown
    category: kernel_module
    cves: []
    severity: high
    cvss_score: 8.3
    notes: |
      Andy Nguyen, Google 2020.  CVE-2020-12351 / -12352 / -24490 are
      LINUX KERNEL BLUEZ CVEs (in net/bluetooth/l2cap_core.c, a2mp.c,
      hci_event.c) — NOT Bluetooth firmware CVEs. They affect Linux
      kernels < 5.10 with BlueZ enabled. Android uses Bluedroid/
      Fluoride in userspace, not BlueZ for the affected code paths,
      and modern Android kernel patch levels post-date the BlueZ fix.
      Disposition (2026-05-15): retargeted from `vendor=broadcom,
      category=bluetooth` (which incorrectly fired on every QCA Rome
      BT firmware blob like BTFM.bin contents — see firmware_patterns
      .yaml correction header) to `category=kernel_module` so it only
      fires on bluetooth.ko / btusb.ko kernel modules. Effectively an
      advisory because most Android builds don't ship bluetooth.ko as
      a standalone module. Keep the entry so the historical attack
      surface is documented; cves: [] is intentional — the kernel-side
      mitigation requires a kernel rebuild, not a firmware blob update.
      Reference: third-party Bluetooth-stack content audit 2026-05-15.

  - name: QSEE Widevine keybox pre-2017
    vendor: qualcomm
    category: tee
    chipset_regex: "(?i)^(sm|sdm|msm|apq)(2[0-9]{3}|6[0-9]{3}|7[0-9]{3}|8[0-9]{3}).*"
    cves:
      - CVE-2015-6639
      - CVE-2016-2431
    severity: high
    cvss_score: 7.5
    notes: |
      Gal Beniamini 2015-2016.  Widevine L1 keybox extraction on pre-2017
      Qualcomm QSEE TAs.  Soft chipset match — historical Snapdragon
      lineage from MSM2xxx forward; pre-2017 QSEE TAs lack reliable
      version banners so the original "widevine.*201[5-7]" gate never
      matched real blobs. Downgrade to medium confidence when chipset
      is unknown.

  - name: MediaTek kamakiri BROM
    advisory_id: ADVISORY-KAMAKIRI
    vendor: mediatek
    category: bootloader
    chipset_regex: "(?i)^mt6[78][0-9]{2}.*"
    cves: []  # mask-ROM, no CVE — flagged as advisory
    severity: critical
    cvss_score: 9.3
    notes: |
      chaosmaster 2020 (mtkclient).  Unauthenticated USB command injection
      in MediaTek BROM.  Universal for MT67xx/MT68xx.  NEVER PATCHED —
      mask-ROM bug.  Treat as advisory finding, not CVE match.

  - name: Qualcomm EDL leaked programmers
    vendor: qualcomm
    category: bootloader
    chipset_regex: "(?i)^(msm|mdm|qm[0-9]|sdm[0-9]{3}|sd[0-9]{3}|sda[0-9]{3})"
    strict_chipset: false
    cves:
      - CVE-2017-18159
    severity: high
    cvss_score: 7.8
    notes: |
      Aleph Security 2017-2018.  Leaked OEM firehose programmers (Xiaomi,
      Nokia) enabled permanent unlock + implant.
      NVD CPE: cpe:2.3:o:google:android:-:*:*:*:*:*:*:* (no specific
      Snapdragon SoCs enumerated). NVD description: "Android for MSM,
      QRD Android, Firefox OS for MSM" — MSM family (CAF kernels through
      June 2018-06-05 security patch).
      chipset_regex tightened per Reviewer B 2026-05-15 — restricted to
      MSM-family naming that EXISTED in the 2018-06-05 CAF kernel cohort
      (msm/mdm/qm/sdm-NNN/sd-NNN/sda-NNN). EXCLUDES post-2018 Snapdragon
      codenames (bengal/kona/lahaina/waipio/niobe/sun/etc.) which would
      over-attribute on 2020+ XBL blobs that NVD does not list as
      affected. strict_chipset: false → soft fallback for blobs with
      NULL chipset_target (typical for Qualcomm bootloaders pre-2026-
      05-15 detection improvements; preserves the 144 currently-firing
      blob rows where chipset_target is NULL).
      Reference: https://nvd.nist.gov/vuln/detail/CVE-2017-18159

  - name: FragAttacks (Broadcom WiFi advisory)
    advisory_id: ADVISORY-FRAGATTACK
    vendor: broadcom
    category: wifi
    category_regex: "^wifi$"
    cves: []
    severity: low
    cvss_score: 3.5
    notes: |
      Mathy Vanhoef 2020-2021 FragAttacks. 802.11 SPEC-level
      fragmentation/aggregation design flaws (CVE-2020-24586/24587/
      24588). Reviewer B 2026-05-15-PM NVD-CPE verification: ZERO
      Broadcom CPEs across all 3 CVEs (NVD lists vendors ieee /
      linux / debian / arista / cisco / intel / microsoft / siemens
      only — no SoftMAC SoC vendor enumerated). Per Rule #19
      recursive NVD-CPE discipline, converted from curated CVE pin
      → advisory tier — preserves forensic visibility on broadcom
      WiFi blobs (one ADVISORY-FRAGATTACK row per blob) while
      respecting the strict NVD CPE attribution scope.
      Converged advisory_id with the qualcomm wcn3xxx/wcn6xxx entry
      below (same shared advisory_id; matcher dedupes per
      (firmware_id, blob_id, cve_id) UNIQUE).
      CVSS scoring per NVD primary CVSS 3.1 (Reviewer B 2026-05-15
      PM independent re-verification — recursive discipline extended
      to CVSS field values per Pattern #2 of postmortem-hw-firmware-
      mcp-tegra-2026-05-15):
        - CVE-2020-24586: 3.5 LOW
        - CVE-2020-24587: 2.6 LOW
        - CVE-2020-24588: 3.5 LOW
      Aggregate severity: low; cvss_score reflects the worst-case
      individual CVE (3.5).
      Reference: https://www.fragattacks.com  +
        https://nvd.nist.gov/vuln/detail/CVE-2020-24586
        https://nvd.nist.gov/vuln/detail/CVE-2020-24587
        https://nvd.nist.gov/vuln/detail/CVE-2020-24588

  # ===================================================================
  # MediaTek subsystem coverage — sourced 2026-04-17 from Android
  # Security Bulletin (CC-BY 2.5) and NVD (public domain).  See
  # .planning/knowledge/handoff-2026-04-17-mtk-phase-c.md and the deep-
  # research report from the same session for per-CVE provenance.
  #
  # MediaTek PSB pages (corp.mediatek.com) are NOT scraped per ToS;
  # ALPS / WCNCR / MOLY patch IDs reproduced as factual cross-reference
  # only.  Severity / chipset_regex / version_regex driven by ASB+NVD.
  # ===================================================================

  # SCP (System Control Processor) — Cortex-M4 system controller.
  # Chipset_target populated by mtk_tinysys parser from platform_tree
  # (e.g. project/CM4_A/mt6771/) or board_tag (aiot8788ep1 → mt8788).
  - name: MediaTek SCP OOB write (CVE-2025-20668)
    vendor: mediatek
    category: mcu
    chipset_regex: "(?i)^mt(6897|6878|6989|8796|8775|6991|6899)$"
    cves:
      - CVE-2025-20668
    severity: high
    cvss_score: 7.8
    notes: |
      ASB Sept 2025 / M-ALPS09625562.  OOB write in SCP firmware, LPE
      from system-uid.  Dimensity 8400/9300/9400-class chipsets.  No
      clean version threshold disclosed -- treat any matching chipset
      as advisory; pair with parser_version_pin once banner extraction
      lands (research notes scp.img carries v\d+\.\d+\.\d+ banners).

