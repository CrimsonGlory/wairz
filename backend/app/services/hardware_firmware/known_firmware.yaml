  # ===================================================================
  # Qualcomm subsystem coverage — sourced 2026-05-15 from Qualcomm Security
  # Bulletins, Android Security Bulletin (CC-BY 2.5), and NVD.  All entries
  # are CHIPSET-ADVISORY: no version_regex (most QC blobs lack version
  # strings), chipset_regex SOFT-matched (downgrades confidence to medium
  # when blob.chipset_target is NULL — common in radio.img / dspso.bin
  # extracts).  Fires on any matching vendor/category/chipset triple.
  # See .planning/postmortems/postmortem-ds1-moto-g32-hardware-firmware-
  # adaptive-detect-2026-05-15 for the audit that drove this expansion
  # (DS1 + G30 had 612 qualcomm blobs and ZERO Qualcomm CVE matches
  # because the four pre-existing entries all required strict version_regex
  # against blob.version which is universally NULL on Qualcomm firmware).
  #
  # chipset_regex `(?i)^(sm|sdm|qcm|qm|wcn|qca)(...).*` covers:
  #   Snapdragon SoCs   — SM4350 (Moto-G30), SM6225 Bengal (Moto-G32),
  #                       SM7325, SM8350, SM8475, SM8650, SM4250...
  #   SDM-series        — SDM450, SDM632, SDM660, SDM712, SDM710, SDM845
  #   Compute Modules   — QCM4290, QCM6490, QCM8550 (IoT / automotive)
  #   Modem-only        — QMxxx (5G Modem-RF System x65, x70, x75, x80)
  #   Wireless combo    — WCN3990, WCN6750, WCN6855, WCN7850 + QCA639x
  # ===================================================================

  - name: Qualcomm Snapdragon modem RCE cluster (2024-2025)
    vendor: qualcomm
    category: modem
    chipset_regex: "(?i)^(sm|sdm|qcm|qm|sa)(4[0-9]{3}|6[0-9]{3}|7[0-9]{3}|8[0-9]{3}|x[0-9]{2,3}).*"
    cves:
      - CVE-2025-27034
      - CVE-2025-21483
      - CVE-2024-43047
      - CVE-2025-21477
    severity: critical
    cvss_score: 9.8
    notes: |
      Qualcomm Security Bulletins 2025-06 + 2025-12.  RCE via PLMN
      selection overflow (CVE-2025-27034, CVSS 9.8), RTP reassembly heap
