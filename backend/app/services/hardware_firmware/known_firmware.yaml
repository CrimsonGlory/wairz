    severity: critical
    cvss_score: 8.8
    notes: |
      AOSP Bluetooth GATT heap overflow in build_read_multi_rsp().
      Remote code execution from attacker on adjacent BT controller
      with no privileges. Fixed in Android 2023-10-05 SPL (AOSP commit
      c0151aa3ba76c785b32c7f9d16c98febe53017b1). Affects Android 12.0,
      12.1, 13.0. Devices below 2023-10 patch level: vulnerable.

