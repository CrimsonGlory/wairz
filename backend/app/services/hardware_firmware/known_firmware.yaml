  - name: Bluedroid / Fluoride HID forced-pairing (CVE-2023-45866 / BleedingPodcast)
    vendor: aosp
    category: bluetooth
    category_regex: "^bluetooth$"
    cves:
      - CVE-2023-45866
    severity: high
    cvss_score: 7.1
    notes: |
      Marc Newlin disclosure 2023-12. BlueZ / Fluoride HID host accepts
      unauthenticated HID keystrokes from an attacker-controlled HID
      device that the host believes is already paired. RCE-adjacent
      (keystroke injection on locked screen). Fix shipped Android
      2023-12-05 SPL; classic_bonded_only=true enforced in pairing
      state machine. Devices below 2023-12 patch level: vulnerable.

  - name: Bluedroid / Fluoride GATT build_read_multi_rsp RCE (CVE-2023-40129)
    vendor: aosp
    category: bluetooth
    category_regex: "^bluetooth$"
    cves:
