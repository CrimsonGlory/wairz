  - name: wpa_supplicant PEAP-MSCHAPv2 phase-2 bypass (CVE-2023-52160)
    vendor: aosp
    category: wifi
    category_regex: "^wifi$"
    cves:
      - CVE-2023-52160
    severity: medium
    cvss_score: 6.5
    notes: |
      Top10VPN disclosure Feb 2024. wpa_supplicant <= 2.10 with PEAP
      enabled and TLS server certificate validation disabled accepts
      attacker-controlled phase-2 authentication, leaking the
      MSCHAPv2 challenge. Fixed in 2.11. Conditions: PEAP enabled in
      config AND ca_cert / ca_path NOT set. Android devices: ALL
      builds shipping wpa_supplicant <= 2.10 are CANDIDATES;
      exploitability requires the unsafe config.

  - name: wpa_supplicant / hostapd SAE side-channel (CVE-2022-23303)
    vendor: aosp
    category: wifi
    category_regex: "^wifi$"
