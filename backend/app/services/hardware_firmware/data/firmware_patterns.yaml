  # ATTRIBUTION CORRECTION (2026-05-15) — BTFM.bin is QUALCOMM-ATHEROS,
  # NOT Broadcom. Yesterday's commit f6bdc4e attributed BTFM to Broadcom
  # based on filename heuristic alone; content evidence proves the
  # opposite:
  #
  # 1. Version banners across every .tlv and .ver file inside BTFM.bin
  #    follow the form `BTFM.<codename>.x.y.z-NNNNN-QCACHROMZ-1` where
  #    QCACHROMZ = Qualcomm Atheros Cherokee/Comanche ROM (Z=signed).
  #    Examples observed in DS1 Moto-G32 + Moto-G30:
  #      BTFM.CMC.1.3.0-00069-QCACHROMZ-1 (Comanche v1.3)
  #      BTFM.CHE.2.0.0-00082-QCACHROMZ-1 (Cherokee v2.0)
  #
  # 2. One .tlv explicitly states `Patch Release PF=WCN3950ROM= 0103
  #    BUILD=BTFM.CMC.1.3.0-00069-QCACHROMZ-1` — WCN3950 is a Qualcomm
  #    WCN-family Rome BT chip (Comanche codename).
  #
  # 3. ZERO `broadcom`, `brcm`, `cypress`, `infineon`, `csr`, `bluez`,
  #    or `wiced` strings in any file inside BTFM.bin (verified by
  #    `strings -n 4 | grep -iE 'broadcom|brcm|cypress|...'`).
  #
  # 4. The .tlv header format is QCA Rome PATCH_HEADER (0x01 followed by
  #    a 3-byte length, load address, end address, nested TLV records,
  #    ARM Thumb push prologue). Broadcom HCD format is a stream of
  #    HCI commands like `01 4c fc ...` (HCI_VS_WRITE_RAM). Neither
  #    devices' files match the Broadcom convention.
  #
  # 5. The container format (Android sparse → ext2 fs → individual
  #    patch + NV files) is the standard Qualcomm BT firmware shipping
  #    convention. Broadcom ships .hcd files referenced by
  #    bt_vendor.conf — a different convention entirely.
  #
  # The codenames Apache (pre-Qualcomm-acquisition Atheros 2011),
  # Cherokee (QCA Rome v1), and Comanche (QCA Rome v2) are all
  # Qualcomm-Atheros internal lineage. Rome is Qualcomm's umbrella name
  # for WCN3xx0 BT silicon (WCN3680, WCN3990, WCN3950, WCN3998).
  #
  # Source: third-party content-evidence audit 2026-05-15 + on-disk
  # verification of DS1 Moto-G32 + Moto-G30 BTFM.bin extracts. The
  # corresponding correction in known_firmware.yaml drops the false
  # BleedingTooth (CVE-2020-12351/12352/24490) attribution — those CVEs
  # are Linux kernel BlueZ bugs at the host OS layer, not firmware bugs.
  #
  # BTFM.bin filesystem contents (Apache+Cherokee+Comanche patch sets +
  # NV calibration blobs for each chip revision); cmbtfw13.* are present
  # on G32 specifically because it's WCN3950-class which uses the v1.3
  # Comanche revision.
  - pattern: "^btfm\\.bin$"
    vendor: qualcomm
    product: "Qualcomm Atheros Rome-family Bluetooth firmware archive (BTFM.bin)"
    category: bluetooth
    confidence: high
    # BTFM.bin is an ext2 fs container — not directly banner-parseable.
    # Leave format=raw_bin so the existing fallback parser runs on the
    # outer container; the banner parser fires on the .tlv / .ver files
    # extracted from inside via the patterns immediately below.
    format: raw_bin
    source: qca-rome-wcn3xxx
  - pattern: "^[a-z]{2}btfw[0-9]+\\.(tlv|ver)$"
    vendor: qualcomm
    product: "Qualcomm Atheros Rome BT firmware (TLV patch, Apache/Cherokee/Comanche)"
    category: bluetooth
    confidence: high
    # Route to bt_fw_banner — parser reads the BTFM.<codename>.x.y.z
    # banner from the file tail and populates blob.vendor + blob.version
    # + blob.chipset_target from content. Prevents the BTFM→Broadcom
    # misattribution class entirely (postmortem 2026-05-15).
    format: bt_fw_banner
    source: qca-rome-wcn3xxx
  # Newer QCA family prefixes (per upstream Linux btqca.c): htbtfw
  # (Hastings → QCA6390), msbtfw (Moselle → WCN6750), hpbtfw (QCA2066),
  # hmtbtfw (WCN7850), wcnhpbtfw (WCN6855). Pattern is general enough
  # to catch them all — parser disambiguates by banner codename.
  - pattern: "^(?:htbtfw|msbtfw|hpbtfw|hmtbtfw|wcnhpbtfw)[0-9]+\\.(tlv|ver)$"
    vendor: qualcomm
    product: "Qualcomm BT firmware (FastConnect family — Hastings/Moselle/WCN6/7xxx)"
    category: bluetooth
    confidence: high
    format: bt_fw_banner
    source: qca-fastconnect
  - pattern: "^[a-z]{2}nv[0-9]+[a-z]?\\.bin$"
    vendor: qualcomm
    product: "Qualcomm Atheros Rome BT NV calibration"
    category: bluetooth
    confidence: medium
    # NV calibration files carry no banner — they're tag-id tables.
    # Route to bt_fw_banner anyway so the parser can confirm "unknown"
    # family with a metadata footprint (negative case is informative).
    # Returns ParsedBlob with no vendor override (filename's qualcomm
    # attribution remains authoritative for NV files).
    format: bt_fw_banner
    source: qca-rome-wcn3xxx
  - pattern: "^bcmdhd[_a-z0-9.-]*\\.(bin|cal)$"
    vendor: broadcom
    product: "Broadcom BCMDHD Wi-Fi firmware"
    category: wifi
    confidence: high
    format: fw_bcm

