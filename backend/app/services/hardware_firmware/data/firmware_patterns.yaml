  # =====================================================================
  # NVIDIA Tegra (TX1/TX2/Nano/Xavier/Orin) — Jetson Linux R32+ payload
  # =====================================================================
  #
  # Per Scout A research 2026-05-18 (NVIDIA L4T R32+ boot architecture).
  # Component families in shipping order during cold boot:
  #   BootROM → MB1 → MB2 (nvtboot) → MCE microcode → cboot → kernel
  # Plus side-loaded: BPMP, SPE, ADSP, camera RTCPU, USB host (XUSB),
  # DRAM ECC. TOS = ATF BL31 + Trusty TEE bundle on T186/T194.
  #
  # Filename conventions:
  #   _t186 / _t194 — chip family suffix
  #   _prod / _prod_cr — production / production-crypto-restricted
  #   _recovery — recovery-boot variant
  # Patterns target the canonical file forms; operator-modified names
  # fall through to path_context refinement when present in known
  # partition trees.

  # BPMP — Boot + Power Management Processor (Cortex-R5) firmware
  - pattern: "^bpmp(?:_t[0-9]{3})?\\.bin$"
    vendor: nvidia
    product: "NVIDIA Tegra BPMP firmware (Cortex-R5)"
    category: bootloader
    confidence: high
    source: nvidia-tegra-l4t

  # MB1 — post-BootROM extension; pinmux/PMIC/SDRAM init via MB1 BCT
  - pattern: "^mb1(?:_t[0-9]{3})?(?:_recovery)?(?:_prod)?\\.bin$"
    vendor: nvidia
    product: "NVIDIA Tegra MB1 boot stage (NVIDIA-key signed)"
    category: bootloader
    confidence: high
    source: nvidia-tegra-l4t

  # MB2 / nvtboot (TegraBoot) — BPMP side + CPU side handoff
  - pattern: "^nvtboot(?:_t[0-9]{3})?(?:_recovery)?(?:_cpu)?(?:_t[0-9]{3})?\\.bin$"
    vendor: nvidia
    product: "NVIDIA Tegra TegraBoot (MB2 / CPU handoff)"
    category: bootloader
    confidence: high
    source: nvidia-tegra-l4t

  # nvtboot_applet — T194 platform-detection applet
  - pattern: "^nvtboot_applet(?:_t[0-9]{3})?\\.bin$"
    vendor: nvidia
    product: "NVIDIA Tegra nvtboot platform-detection applet"
    category: bootloader
    confidence: high
    source: nvidia-tegra-l4t

  # cboot — Little-Kernel-based CPU bootloader
  - pattern: "^cboot(?:_t[0-9]{3})?\\.bin$"
    vendor: nvidia
    product: "NVIDIA Tegra cboot (Little Kernel CPU bootloader)"
    category: bootloader
    confidence: high
    source: nvidia-tegra-l4t

  # U-Boot for Tegra (when shipped — OE4T / Jetson Linux optional)
  - pattern: "^u-boot-jetson-[a-z0-9-]+\\.bin$"
    vendor: nvidia
    product: "U-Boot for Tegra (OE4T u-boot-tegra lineage)"
    category: bootloader
    confidence: high
