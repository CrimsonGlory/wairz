# Realtek BT chipset table — project_id → chipset mapping.
#
# Source: upstream Linux drivers/bluetooth/btrtl.c `ic_id_table[]` +
# `project_id_to_lmp_subver[]` (torvalds/linux master, 2026-05-18 snapshot).
# Scout C research 2026-05-18.
#
# Schema (per entry):
#   project_id:    Small integer (0-51) found at the END of the firmware
#                  blob via reverse-TLV scan: (opcode=0, length=1, data=PID).
#                  NOT at offset 8 — offset 8 is fw_version (uint32 LE v1)
#                  or ASCII fw_version[8] (v2). Per btrtl.h `rtl_epatch_header`.
#   chipset:       Canonical lower-case chipset identifier.
#   display:       Human-readable chipset label.
#   lmp_subver:    LMP subversion (16-bit hex) — matched against the HCI
#                  Read_Local_Version_Information response.
#   hci_rev:       HCI revision (8-bit hex) — used for fine-grained
#                  firmware-version pinning.
#   hci_ver:       HCI version (8-bit hex).
#   bus:           Connection bus: USB / UART / both (sets driver path:
#                  hci_uart vs hci_usb).
#   family:        Generation tag (legacy / RTL87xx / RTL88xx / FastConnect).
#   filename_fw:   Canonical _fw.bin filename in linux-firmware /rtl_bt/.
#   filename_config: Companion _config.bin filename (UART-only blobs).
#
# Operators wishing to add a new chipset variant edit THIS file —
# changes are picked up via mtime hot-reload (no docker restart).
#
# CRITICAL antipattern (per Scout C 2026-05-18): DO NOT pin BLUFFS /
# BIAS / KNOB / Bluetooth Core spec CVEs to specific Realtek chipsets
# via NVD-CPE-derived chipset_regex — those CVEs have no Realtek CPE.
# DO NOT pin the RTL8762E SDK CVEs (CVE-2024-48290 / -2025-44526 /
# -44531 / -44559) to chipsets OTHER than RTL8762E — disclosure-batch
# extrapolation is the antipattern this codebase has hit before.

chipsets:
  - project_id: 0
    chipset: rtl8723a
    display: RTL8723A
    lmp_subver: 0x1200
    hci_rev: 0x0b
    hci_ver: 0x06
    bus: usb
    family: legacy
    filename_fw: rtl8723a_fw.bin

  - project_id: 1
    chipset: rtl8723b
    display: RTL8723B / 8723BS
    lmp_subver: 0x8723
    hci_rev: 0x0b
    hci_ver: 0x06
    bus: both
    family: rtl87xx
    filename_fw: rtl8723b_fw.bin
    filename_config: rtl8723b_config.bin

