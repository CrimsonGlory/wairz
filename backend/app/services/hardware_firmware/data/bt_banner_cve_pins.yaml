# Banner-pin → CVE rules. Each pin fires when ALL match conditions
# evaluate true against a parsed BT firmware banner record; produces
# one Finding per CVE in the pin's `cves:` list, with rationale text
# templated against record fields.
#
# Externalized 2026-05-17 — Reviewer C H2 from postmortem-bt-banner-
# parser-session-2026-05-16.md. Replaces the hardcoded `_maybe_pin_
# braktooth` function in parsers/bt_firmware_banner.py with a generic
# rule engine that operators can extend WITHOUT Python changes.
#
# Loaded by patterns_loader._load_banner_cve_pins() (@lru_cache);
# consumed by parsers/bt_firmware_banner.py via `get_banner_cve_pins()`.
# Graceful-degrade (Rule #34): on missing or malformed YAML the loader
# logs a WARNING and returns the in-tree _BANNER_CVE_PIN_DEFAULTS (the
# BrakTooth pin) so detection keeps working without operator intervention.
#
# Schema:
#
#   pins:
#     - id:          kebab-case stable identifier; logged + tracked in
#                    rationale traceback so operators can audit emitted
#                    findings back to the pin rule. REQUIRED.
#       description: human-readable summary of what this pin matches.
#                    REQUIRED.
#
#       # ---- Match conditions ----
#       # ALL conditions must evaluate true for the pin to fire. Omitting
#       # a condition means "don't gate on it". At least ONE condition
#       # is required (a pin with NO gates would fire on every BT blob).
#       family:            qca_rome | broadcom_hcd | mediatek_bt
#       codename_in:       [QCA 3-letter codenames]   # qca_rome only
#       chipset_target_in: [list of chipset names]     # all families
#       banner_match:      Python regex (re.IGNORECASE) against record.banner
#       build_date_before: YYYY-MM-DD; record.build_date must parse as
#                          "MMM DD YYYY" AND be strictly before this date.
#                          (Broadcom HCD primarily — uses the BRCMcfg block
#                          date stamp.) Fail-closed: missing or unparseable
#                          date → pin does not fire; DEBUG-logged.
#       build_id_lt:       integer; record.build_id (string, possibly
#                          "00069" or "00069.1") must coerce-to-int AND be
#                          strictly less than this value. (qca_rome /
#                          mediatek_bt — banner build_id field.) Fail-closed
#                          on non-int. NOTE: `build_id_lt: 0` with no other
#                          gate is rejected as a likely-unfilled sentinel.
#       signed_eq:         "signed" | "unsigned"; matches record.signed.
#                          (qca_rome — banner trailing 'Z' on QCACHROMZ /
#                          QCAMTROMZ indicates signed; broadcom_hcd always
#                          emits "unsigned" for HCI-stream HCDs.)
#
#       # ---- CVE list ----
#       # Each entry generates one ParsedBlob.metadata.known_vulnerabilities
#       # row when the parent pin fires.
#       cves:
#         - id:         CVE-YYYY-NNNNN  (REQUIRED; case-sensitive ID)
#           severity:   critical | high | medium | low | info  (REQUIRED)
#           subcomponent: free-text component name (default: "bluetooth")
#           confidence: high | medium | low  (default: "high")
#           rationale:  multi-line text; templated with str.format against
#                       {banner}, {chipset}, {chipset_upper}, {codename},
#                       {build_id}, {build_date} from the record.
#                       REQUIRED.
#           reference:  URL to disclosure / NVD entry. RECOMMENDED — strong
#                       audit trail for the per-CVE attribution.
#
# ----------------------------------------------------------------------
# CRITICAL — Reviewer B 2026-05-16 + 2026-05-17 discipline applies here:
# ----------------------------------------------------------------------
# Every CVE entry MUST cite the NVD URL in `reference:`. Before adding
# a CVE pin to this file, INDEPENDENTLY verify the NVD CPE list for
# that CVE contains each chipset in `chipset_target_in:`. The antipattern
# this file was created to make rarer is "disclosure-batch attribution"
# — extrapolating from "all CVEs in disclosure X apply to all devices
# in disclosure X" rather than checking each CVE independently against
# NVD's CPE entries.
#
# Canonical examples from the BrakTooth (2021) disclosure batch that
# this rule guards against:
#
# * **CVE-2021-28139** — BrakTooth RCE CVSS 8.8 — NVD CPE: ONLY Espressif
#   ESP-IDF / ESP32. NOT Qualcomm. (Reviewer B 2026-05-16 catch.)
# * **CVE-2021-34147** — NVD CPE: ONLY Cypress (Infineon) WICED / CYW20735B1.
# * **CVE-2021-31609** — NVD CPE: ONLY Silicon Labs iWRAP / WT32i-A.
# * **CVE-2021-31612** — NVD CPE: ONLY Zhuhai Jieli AC69xx.
#
# The CORRECT Qualcomm BrakTooth-DoS CVE per NVD CPE list is
# **CVE-2021-30348** (Qualcomm CNA, CVSS 6.5, "Improper validation of
# LLM utility timers availability"). It is the SINGLE Qualcomm-attributed
# CVE in the BrakTooth disclosure family — pinning the other 3 batch
# CVEs on a qca_rome firmware would replicate the misattribution class
# this whole campaign was built to make rarer.
#
# Family extrapolation is NOT a substitute for per-CVE NVD-CPE check
# either. CVE-2023-28581 was previously authored with chipset_regex
# matching WCN3xx0 family because the QSB notes mentioned "WCN family";
# the actual NVD CPE list is FastConnect 6800/6900/7800 + QCA6391/6426/
# 6436 + Snapdragon 865/870/8 Gen 1 + ... — NOT WCN3950 or WCN3990.

pins:
  # ---- Qualcomm BrakTooth Rome DoS (Tier 0 — banner-confirmed) ----
  # CVE-2021-30348 is the ONLY NVD-CPE-confirmed Qualcomm BrakTooth CVE.
  # NVD CPE coverage includes wcn3950, wcn3990, wcn3991, wcn3998, wcn6750,
  # qca6390 — the chipset_target_in: below is the Rome subset; future
  # extension to wcn6750/qca6390 (Hastings/Moselle codenames) is a
  # separate scope decision (the same CVE applies; operator judgment
  # call on whether FastConnect should fire under the same pin).
  - id: qualcomm-braktooth-qca-rome-dos-cve-2021-30348
    description: Qualcomm BrakTooth LLM utility-timer DoS (CVE-2021-30348) on Rome WCN3xx0 BT firmware
    family: qca_rome
    chipset_target_in: [wcn3950, wcn3990, wcn3991, wcn3998]
    cves:
      - id: CVE-2021-30348
        severity: medium
        subcomponent: bluetooth
        confidence: high
        rationale: |
          BT firmware banner '{banner}' confirms {chipset_upper} (QCA Rome
          family). Per NVD's CPE list (vendor=qualcomm), CVE-2021-30348
          is the Qualcomm BrakTooth-class LLM utility-timer availability
          DoS affecting WCN3950 / 3990 / 3991 / 3998 (plus WCN6750,
          QCA6390, and other Snapdragon SoCs). Disclosed in the ASSET
          BrakTooth research (Garbelini et al. 2021); CNA=Qualcomm,
          CVSS 6.5.
        reference: https://nvd.nist.gov/vuln/detail/CVE-2021-30348

  # ----------------------------------------------------------------------
  # Worked examples — disabled by default. Uncomment ONLY after
  # INDEPENDENTLY verifying the NVD CPE list contains every chipset in
  # `chipset_target_in:` AND that the advisory description matches the
  # subcomponent / family you're pinning against. The match-condition
  # shapes below demonstrate every gate the loader supports.
  # ----------------------------------------------------------------------

  # # ---- Broadcom BCM43xx pre-Sep-2017 (Armis BlueBorne family) ----
  # # PREREQ before uncomment: this is HOST-stack-attributed in NVD (the
  # # CPE list for CVE-2017-0781 is Google Android 4.0–8.0, NOT specific
  # # BCM43xx models). The firmware-side reach via L2CAP fragmentation is
  # # discussed in Armis's BlueBorne paper but is NOT captured in NVD's
  # # CPE list. Uncomment ONLY if you have per-chip evidence from the
  # # Armis paper (or vendor advisory) that the SPECIFIC BCM model in
  # # chipset_target_in: is in scope. Confidence is "medium" to reflect
  # # the host-stack-vs-firmware attribution fuzziness; consider whether
  # # the curated `known_firmware.yaml` matcher (vendor=aosp, category=
  # # bluetooth) covers your operational need without firmware-side pins.
  # - id: broadcom-blueborne-bt-stack-bcm43xx-pre-sep-2017
  #   description: Armis BlueBorne (BCM43xx pre-Sep-2017 BT firmware HCI-stack reach)
  #   family: broadcom_hcd
  #   chipset_target_in: [bcm4339, bcm4340, bcm4345, bcm4347, bcm4356, bcm4358]
  #   build_date_before: 2017-09-12
  #   cves:
  #     - id: CVE-2017-0781
  #       severity: critical
  #       subcomponent: bluetooth
  #       confidence: medium
  #       rationale: |
  #         BT firmware banner '{banner}' built {build_date} predates
  #         the Sep 2017 BlueBorne patch wave for {chipset_upper}. NVD
  #         CPE for CVE-2017-0781 covers the Bluedroid host stack
  #         (Android 4.0–8.0); firmware-side reach via L2CAP frag is
  #         secondary evidence — operator validation required.
  #       reference: https://nvd.nist.gov/vuln/detail/CVE-2017-0781

  # # ---- MediaTek WLAN OOB-write CVE-2024-20017 (example of signed_eq gate) ----
  # # PREREQ before uncomment + IMPORTANT correction (Reviewer B 2026-05-17):
  # # CVE-2024-20017 NVD CPE lists MT7622 / MT7915 / MT7916 / MT7981 /
  # # MT7986 / MT6890 — **NOT** MT7663. The advisory is also a **WLAN**
  # # OOB-write (wlan service / MediaTek SDK ≤ 7.4.0.1 / 7.6.7.0), not
  # # a BT issue. This commented example shows the signed_eq gate
  # # AGAINST AN INTENTIONALLY-WRONG CHIPSET to remind operators that
  # # MT7663 is NOT in NVD's CPE list; use a curated-matcher entry under
  # # vendor=mediatek + category=wlan/wifi if you want CVE-2024-20017
  # # coverage on actual MT7622/7915/etc. firmware, not a banner-pin here.
  # - id: mediatek-wlan-oob-write-cve-2024-20017-example
  #   description: |
  #     EXAMPLE-ONLY: CVE-2024-20017 is a MediaTek WLAN OOB-write
  #     (CPE: MT7622/7915/7916/7981/7986/6890). Pinning it on MT7663
  #     would be NVD-CPE-incorrect; this entry exists ONLY to demonstrate
  #     the signed_eq gate syntax. Real coverage belongs in the curated
  #     CVE matcher under vendor=mediatek + category=wlan.
  #   family: mediatek_bt
  #   chipset_target_in: [mt7622, mt7915]      # demo-correct chipsets
  #   signed_eq: unsigned                      # gate example — dev/debug builds
  #   cves:
  #     - id: CVE-2024-20017
  #       severity: critical
  #       subcomponent: wlan
  #       confidence: low
  #       rationale: |
  #         EXAMPLE-ONLY ENTRY. CVE-2024-20017 is MediaTek SDK WLAN OOB-
  #         write; banner-pin path is the wrong shape — use the curated
  #         CVE matcher (known_firmware.yaml) under vendor=mediatek +
  #         category=wlan/wifi instead.
  #       reference: https://nvd.nist.gov/vuln/detail/CVE-2024-20017
